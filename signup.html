<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - Smart Loans for Gig Workers</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .signup-box {
      background: #f9f9f9;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    .signup-box h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #2c3e50;
    }
    .input-group {
      margin-bottom: 1.2rem;
    }
    .input-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
      color: #333;
    }
    .input-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }
    .input-group input:focus {
      border-color: #27ae60;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn:hover {
      background-color: #219150;
    }
    .note {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #7f8c8d;
    }
    .note a {
      color: #27ae60;
      text-decoration: none;
    }
    .note a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="signup-box">
    <h2>Create Account - Smart Loans for Gig Workers</h2>
    <form onsubmit="return registerUser()">
      <div class="input-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" required />
      </div>
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" required />
      </div>
      <button class="btn" type="submit">Sign Up</button>
    </form>
    <p class="note">Already have an account? <a href="login.html">Login here</a></p>
    <p class="note"><a href="index.html">Back to Home</a></p> <!-- Link to Home Page -->
    <p class="note"><a href="privacy-policy.html">Privacy Policy</a></p> <!-- Link to Privacy Policy Page -->
  </div>

  <script>
    function registerUser() {
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (name && email && password) {
        alert("Registration successful!");
        window.location.href = "login.html"; // Redirect to login after successful registration
      } else {
        alert("Please fill in all fields.");
      }

      return false; // Prevent form submission
    }
  </script>

</body>
</html>
