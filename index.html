<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Loans for Gig Workers - Sign In</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: #f9f9f9;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    .login-box h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #2c3e50;
    }
    .input-group {
      margin-bottom: 1.2rem;
    }
    .input-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
      color: #333;
    }
    .input-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }
    .input-group input:focus {
      border-color: #27ae60;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn:hover {
      background-color: #219150;
    }
    .note {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #7f8c8d;
    }
    .note a {
      color: #27ae60;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Sign In - Smart Loans for Gig Workers</h2>
    <form onsubmit="return loginUser()">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" required />
      </div>
      <button class="btn" type="submit">Sign In</button>
    </form>
    <p class="note">Don't have an account? <a href="signup.html">Create one</a></p>
    <p class="note">Test Login: user@example.com / password</p>
  </div>

  <script>
    function loginUser() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (email === "user@example.com" && password === "password") {
        alert("Login successful!");
        window.location.href = "dashboard.html"; // Redirect to homepage
      } else {
        alert("Invalid email or password");
      }

      return false; // Prevent form submission
    }
  </script>

</body>
</html>
